# The paired SDDM positions live in sddm/theme.conf.
$wall = $HOME/dotfiles/wallpapers/breathtaking-shot-lake-surrounded-by-snowy-mountains-foggy-sky-norway.jpg
$profie_image = $HOME/dotfiles/hyprlock/wallpapers/me.jpeg

general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = false
    transparent = true
}

# BACKGROUND
background {
    path = $wall
    blur_passes = 0
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.86)
    font_size = 14
    font_family = Adwaita Sans
    position = 0, -125
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span weight='ultralight'>$(date +"%-I:%M")</span>"
    color = rgba(255, 255, 255, 0.94)
    font_size = 90
    font_family = Adwaita Sans
    position = 0, -145
    halign = center
    valign = top
}

# Profile photo
image {
    monitor =
    path = $profie_image
    border_size = 0
    size = 68
    rounding = -1
    rotate = 0
    reload_time = -1
    position = 0, 185
    halign = center
    valign = bottom
}

# User name
label {
    monitor =
    text = thui
    color = rgba(255, 255, 255, 0.92)
    font_size = 16
    font_family = Adwaita Sans
    position = 0, 125
    halign = center
    valign = bottom
}

# Password field
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.32)
    inner_color = rgba(255, 255, 255, 0.22)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = Adwaita Sans
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffcc">Enter Password</span>
    hide_input = false
    position = 0, 65
    halign = center
    valign = bottom
    rounding = 23
}
