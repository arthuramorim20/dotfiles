[config.wallpaper]
command = "~/dotfiles/hypr/scripts/set-wallpaper.sh"
arguments = ["{{ image }}"]
set = true

[templates.waybar]
input_path = '~/dotfiles/matugen/templates/colors.css'
output_path = '~/dotfiles/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.kitty]
input_path = '~/dotfiles/matugen/templates/kitty-colors.conf'
output_path = '~/dotfiles/kitty/colors.conf'
post_hook = "kill -SIGUSR1 $(pidof kitty)"

[templates.hyprland]
input_path = '~/dotfiles/matugen/templates/hyprland-colors.conf'
output_path = '~/dotfiles/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.gtk3]
input_path = '~/dotfiles/matugen/templates/gtk-colors.css'
output_path = '~/dotfiles/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/dotfiles/matugen/templates/gtk-colors.css'
output_path = '~/dotfiles/gtk-4.0/colors.css'

[templates.rofi]
input_path = '~/dotfiles/matugen/templates/rofi-colors.rasi'
output_path = '~/dotfiles/rofi/colors.rasi'

[templates.cava]
input_path = '~/dotfiles/matugen/templates/matugen-cava'
output_path = '~/dotfiles/cava/config'
post_hook = "pkill -USR1 cava"

[templates.spicetify]
input_path = '~/dotfiles/matugen/templates/spotify-colors.ini'
output_path = '~/dotfiles/spicetify/Themes/text/color.ini'

[templates.vesktop]
input_path = '~/dotfiles/matugen/templates/midnight-discord.css'
output_path = '~/dotfiles/vesktop/themes/matugen.css'

