# Nord-inspired theme.
# Theme files contain presentation only; keybindings and plugins stay in
# ../tmux.conf so another theme can replace this file without side effects.

set -g status-interval 1
set -g status-left-length 40
set -g status-right-length 180

set -g status-style "fg=#d8dee9,bg=#2e3440"
set -g message-style "fg=#eceff4,bg=#3b4252"
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#88c0d0"

set -g status-left " #[fg=#88c0d0,bold]#S #[fg=#4c566a]│ "
set -g window-status-format " #[fg=#81a1c1]#I #[fg=#d8dee9]#W "
set -g window-status-current-format " #[fg=#2e3440,bg=#88c0d0,bold] #I #W #[default]"
set -g window-status-separator ""
set -g status-right "#[fg=#81a1c1]#{pane_current_path} #[fg=#4c566a]│ #[fg=#8fbcbb]%d-%m-%y %H:%M:%S #[fg=#88c0d0]"
