# ─── General ─────────────────────────────────────────────────────────────────

set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -g mouse on
set-option -g status-position bottom

# Default shell
set-option -g default-shell /bin/zsh
set-option -g default-command "exec /bin/zsh"
set-environment -g SHELL /bin/zsh
set-environment -g ZSH "$HOME/.oh-my-zsh"

# ─── Keybindings ─────────────────────────────────────────────────────────────

# Reload config
unbind r
bind r source-file ~/.tmux.conf

# Sync panes toggle
bind-key a set-window-option synchronize-panes \; \
    display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Open new window/pane in the current path
bind c new-window         -c "#{pane_current_path}"
bind '"' split-window     -c "#{pane_current_path}"
bind % split-window -h    -c "#{pane_current_path}"

# tmux <-> nvim pane navigation (christoomey/vim-tmux-navigator pattern)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version <  3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'   'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

bind-key -T copy-mode-vi 'C-h'  select-pane -L
bind-key -T copy-mode-vi 'C-j'  select-pane -D
bind-key -T copy-mode-vi 'C-k'  select-pane -U
bind-key -T copy-mode-vi 'C-l'  select-pane -R
bind-key -T copy-mode-vi 'C-\'  select-pane -l

# ─── Plugins ─────────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'

# ─── tmux-continuum ──────────────────────────────────────────────────────────

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# ─── tmux-sessionx (built-in bindings disabled; custom 'O' below) ────────────

set -g @sessionx-bind ''
set -g @sessionx-prefix off
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-filter-current 'false'

# ─── Theme ───────────────────────────────────────────────────────────────────

# The active theme is a symlink so the core configuration stays theme-agnostic.
source-file ~/dotfiles/tmux/theme.conf

# ─── TPM ─────────────────────────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# Drop sessionx's root-level 'O' binding so plain Shift+O reaches nvim/lvim and
# the shell. sessionx re-adds '-n O' on plugin load (empty @sessionx-bind falls
# back to 'O'), so this must run last, after TPM. Use prefix+O to open sessionx.
run-shell -b "sleep 1 && tmux unbind-key -T root O"
